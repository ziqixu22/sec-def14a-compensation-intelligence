name: Refresh SEC compensation data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 15 * *'

permissions:
  contents: write

concurrency:
  group: sec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contact configuration
        run: test -n "$SEC_USER_AGENT"
      - name: Fetch, extract, validate, and build report
        run: python3 sec_comp.py run --years 2025 2026 "$(date -u +%Y)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-queues
          path: |
            data/out/review_queue.csv
            data/out/narrative_review_queue.csv
            data/out/exceptions.csv
            data/out/live_validation.json
          if-no-files-found: ignore
      - name: Publish reviewed and rule-reconciled outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/out/powerbi_compensation.csv data/out/powerbi_incentives.csv data/out/report.html data/out/status.json data/out/live_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SEC compensation report'
            git push
          fi
